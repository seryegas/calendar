name: Publish frontend image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # VITE_* variables are baked into the build. Override them via repo
      # Actions Variables (Settings → Secrets and variables → Actions → Variables);
      # fall back to the current prod defaults when unset.
      - name: Create .env for build
        run: |
          cat > .env <<EOF
          VITE_HOST=${{ vars.VITE_HOST || 'localhost' }}
          VITE_PORT=${{ vars.VITE_PORT || '4000' }}
          VITE_API_PART=${{ vars.VITE_API_PART || 'api' }}
          FRONTEND_PORT=${{ vars.FRONTEND_PORT || '3000' }}
          EOF

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
