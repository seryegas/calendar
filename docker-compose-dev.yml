version: "3.9"

services:
  frontend:
    image: calendar-frontend-dev:latest   # свой тег, чтобы dev-сборка не перезатирала prod-образ calendar-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env.dev
    environment:
      NODE_ENV: development
    ports:
      - "${FRONTEND_PORT_EXTERNAL}:${FRONTEND_PORT_EXTERNAL}"
    volumes:
      - .:/app
      - /app/node_modules
